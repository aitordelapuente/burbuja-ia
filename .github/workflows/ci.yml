# CI (sección 18.8). Es el check obligatorio («ci») de la protección de la rama main.
# workflow_dispatch permite que los jobs de datos lancen CI sobre la rama de un PR creado con GITHUB_TOKEN
# (los eventos de GITHUB_TOKEN no disparan pull_request); ver docs/OPERACION.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOCK_DATA: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests unitarios
        run: pnpm test

      - name: Tests de mantenimiento (fixtures y GitHub simulado; sin red)
        run: pnpm test:maintenance

      - name: Validar data/manual y data/auto
        run: pnpm test:manual-data

      - name: Build (MOCK_DATA=1)
        run: pnpm build

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Caché de navegadores de Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Dependencias del sistema de Chromium
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E y accesibilidad (MOCK_DATA=1)
        run: pnpm e2e

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
